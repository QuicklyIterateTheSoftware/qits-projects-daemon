# The release pipeline: this repository reacts to its OWN release TAG and pushes TWO images under the
# released VERSION — the daemon image, and the layered project-agent image built on top of it.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMRelease` says only "this repository released this version",
# and qits-projects says it the instant the tag is written; nothing here releases anything. The
# event that could loop is `SoftwareRelease`, and this file neither listens for it nor emits it.
#
# THE VERSION TAG IS A NEW COORDINATE BESIDE THE SHA, NOT A REPLACEMENT FOR IT. ci-post-receive.yml
# keeps pushing `:$QITS_CI_SHA` on every green push; what this adds is a name a human and a
# downstream consumer can say out loud. The two coordinates have two owners — a build is named by
# its commit, a release by its version — and the step below says why that split is also the only
# shape that pushes reliably.
#
# THE LAYERED IMAGE IS THIS PIPELINE'S SECOND OUTPUT, AND IT EXISTS ONLY HERE. `qits/project-agent`
# is docker/Dockerfile.projects — the released workspace toolchain with this daemon copied in as its
# entrypoint — and it was a hand-built local tag (`qits/project-agent:native`) on one machine until
# this file built it. Both halves it layers were already published; the layering was not, so the
# image a refinement agent actually runs had no history and no coordinate anyone could name, and a
# host that lost its local image store lost the ability to start an agent at all.
#
# WHY IT IS NOT ALSO BUILT IN ci-post-receive.yml. The toolchain base is ~3.4 GB, so a sha-coordinate
# copy would pull and push that on every commit — and nothing consumes this image by sha. An agent
# is started from a version, so the version is the only coordinate worth the bytes. The daemon image
# stays in post-receive because it is small.
#
# THE BASE IS PINNED BY VERSION, NOT FOLLOWED BY A FLOATING TAG, AND THE PIN LIVES IN THE DOCKERFILE.
# `docker/Dockerfile.projects`'s `ARG BASE=qits/workspace-base:<version>` holds it, and the step below
# scrapes that line. images/qits-oci-workspace publishes only `:<version>` — no `:latest`, by its own
# ONE TAG PER PIPELINE rule — so there is no floating tag to follow even if we wanted one, and
# following one would make this image unreproducible: rebuilding a released version would silently
# pick up a different toolchain.
#
# QITS-MAINTENANCE IS WHAT MOVES THAT PIN. It reads literal `ARG <NAME>=<image>:<tag>` defaults as
# docker pins, bumps the tag on its own branch when the toolchain releases, and asks the release door
# itself. The loop closes with nobody in it and with nothing repository-local doing the following:
# the toolchain releases, the pin bumps, that push releases this repository, and this pipeline
# republishes `qits/project-agent` on the new base. It replaced a hop pipeline here that rewrote a
# `.config/qits/workspace-base.version` file; the file went with it, because a pin the machine reads
# has to sit where the machine looks.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the
# `buildctl` pushes below are this repository's own step — so it cannot see what landed. It announces
# one `SoftwareRelease` per entry on the strength of these lines once the whole pipeline is green.
# Keep them true.
#
# THE NAMES ARE UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the
# registry is `qits-platform-artifacts:8080` inside a step container and `localhost:8081` to qits-ci
# and qits-deployments — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/projects-daemon` and `qits/project-agent`, and the reader supplies its own host, exactly as
# the step below composes one from environment.
#
# THE DAEMON BUILD BELOW IS ci-event-release-request.yml's, AND THE TWO MUST STAY MATCHED — byte for
# byte in every buildctl argument, because the platform builder's cache is shared and a matched build
# is what makes a release that follows a green fold a stack of cache hits rather than a second native
# compile. That file explains the whole builder arrangement (`build: true` as the declaration that
# injects `$BUILDKIT_HOST` and mounts no socket, why the Dockerfile's committed mirror vhosts are the
# builder's to rewrite, the file-form secrets, why there is no `--network host` any more); this one
# carries the short form and points there rather than keeping a second copy of the reasoning to
# drift. The layered build has no counterpart there and never will — see above.
#
# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED. The bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
#
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-projects-daemon }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/projects-daemon }
  - { type: docker, name: qits/project-agent }
steps:
    # ci-base: buildctl for the builds, git for the tag checkout, jq for the event payload.
    # Nothing needs maven on ANY side of the builder — the reactor is built inside the image's own
    # builder stage.
    #
    # `build: true` REPLACED `docker: true` WHEN THE BUILD MOVED OFF THE HOST DAEMON. It is the
    # per-step, diff-visible declaration the platform keys everything on — the commissioned
    # credential, the auth document, and the platform builder's address, which qits-containers
    # injects as $BUILDKIT_HOST into exactly these steps — and it mounts no docker socket, because
    # nothing here uses one. qits-buildkit-plan.md is the whole migration.
    #
    # BOTH IMAGES ARE STILL ONE STEP, and the reason changed shape rather than going away: the second
    # build's `DAEMON_IMAGE` is the reference the first one pushed, so the two are ordered and the
    # second is only a `FROM` away from a registry pull the builder makes for itself. Keeping them in
    # one step keeps that ordering visible and costs nothing, since a step container carries no image
    # store either way.
    #
    # TWO HOURS, NOT ONE. The layered build pulls the ~3.4 GB toolchain base and pushes a layer on
    # top of it, on top of the daemon's native compile. images/qits-oci-workspace found an hour short
    # of headroom for the same bytes on a cold cache.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed and the run reports SUCCESS for an image that was never built — and a green release
      # run is what makes qits-ci announce the artifact. -u makes an unset injected variable stop the
      # step too.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject them; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this recipe must fail here, naming the cause,
      # rather than compose a reference out of empty strings.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      # THE TAG NAME IS THE VERSION, and release versions are CalVer — digits and dots. Checked
      # before anything is built, because the version becomes a registry TAG: a malformed one would
      # publish the daemon under a coordinate nobody can guess, and a value carrying `:` or `/`
      # would land it under a different name entirely. It carries more weight than it did against
      # SCMRelease: no release flow vets this string now, since any tag pushed here arrives as one
      # of these events. qits-ci-daemon and qits-oci refuse the same way for the same reason.
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/projects-daemon:$version and qits/project-agent:$version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # is where the release commit is *now* — a later push moves that and the tag does not, so a
      # busy main cannot make this pipeline ship a different tree than the one that was released.
      # The clone is shallow and carries no tags, hence the explicit refspec; the URL rather than
      # `origin` because every address a step needs arrives as environment.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # THE TOOLCHAIN PIN, READ FROM THE RELEASED TREE. The checkout above already moved this tree to
      # `$version`, so the base version is the one that tree was released with — rebuilding a tag
      # rebuilds it on the same toolchain, which is the whole reason the pin is committed. Reading it
      # before the checkout would have taken main's.
      #
      # THE PIN'S HOME IS docker/Dockerfile.projects NOW, not `.config/qits/workspace-base.version`.
      # That file is deleted, and with it the hop pipeline that rewrote it: qits-maintenance reads the
      # literal `ARG BASE=qits/workspace-base:<version>` default as a docker pin and bumps the tag on
      # that line. So this step scrapes the line rather than reading a file — the version has to come
      # from wherever the machine moves it, and the Dockerfile is that place.
      #
      # ANCHORED ON THE WHOLE LINE, WHICH IS WHAT MAKES IT SAFE TO SCRAPE. `^ARG BASE=` matches
      # exactly one line in that file, and `DAEMON_IMAGE` — the other image ARG — cannot be caught by
      # it. An empty result fails the CalVer check below, so a reflowed or renamed pin stops the
      # release rather than composing a reference with no tag.
      #
      # READ AND VALIDATED HERE, BEFORE ANY BUILD, though it is only used by the second one. A bad
      # pin caught after the daemon push would leave exactly the partial release this pipeline is
      # shaped to avoid: one of the two declared artifacts published, the other never built, and the
      # run red. Both inputs are checked while nothing has been pushed.
      base_version=$(sed -nE 's#^ARG BASE=qits/workspace-base:(.+)$#\1#p' docker/Dockerfile.projects)
      # Validated exactly like $version, and for the same reason: it becomes part of an image
      # reference. A stray `:` or `/` would pull a different image entirely, and an unmatched sed
      # would compose a reference with no tag — which docker reads as `:latest`, a tag
      # images/qits-oci-workspace never publishes.
      case "$base_version" in
        ''|*[!0-9.]*) echo "ARG BASE in docker/Dockerfile.projects is not a CalVer pin: $base_version" >&2; exit 1 ;;
      esac
      echo "layering onto qits/workspace-base:$base_version"

      # THE VERSION IS THE ONLY COORDINATE THIS STEP PUBLISHES, and the sha coordinate is not
      # missing: ci-event-release-request.yml pushes `:<sha>` for every fold it builds green.
      # Publishing both from here as well was tried and is what the first release of this file failed
      # on — `docker build -t A -t B` reported naming both tags, then `docker push B` answered "tag
      # does not exist", because BuildKit's exporter did not reliably leave every alias of a
      # multi-tag build in the local image store. That store is no longer in the path at all under
      # `push=true`, so the mechanism behind that failure is gone; what stays is the honest reading
      # of it, which was never about the store: the two coordinates have two owners, the QA pipeline
      # names a build by its commit and a release names it by its version. buildctl's push takes ONE
      # name anyway, and a second name would be a second declaration.
      #
      # Each build is therefore one build and one published name, which is also the shape that cannot
      # leave a partial release behind — the rule qits-oci's release pipeline states for its five
      # images.
      #
      # THE TWO SECRETS ARE THE FLEET'S SHAPE FOR A CREDENTIAL INSIDE A BUILD, and both builds below
      # carry them, in FILE form on both sides: written under umask 077 into /tmp — outside the
      # clone, so neither can enter a build context — handed to buildctl as `src=`, and mounted by
      # the daemon Dockerfile as bare files under /run/secrets for `.qits-maven-settings.xml`'s
      # `qits-central-proxy` server. Never a --build-arg, which is recorded in a pullable image's
      # history, and never the `env=` mount form, which couples this recipe to the builder's
      # dockerfile-frontend version. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and `:-` keeps the pair
      # OPTIONAL exactly as `--secret …,env=` was. Dockerfile.projects only copies, so its pair stays
      # inert — buildkit ignores a secret no RUN mounts.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # The QITS_MAVEN_CENTRAL_URL build-arg routes the daemon build's Maven Central resolve through
      # the mirror by its IN-NETWORK route ($QITS_MAVEN_PROXY_URL). There is no `--network host` and
      # nothing replaces it: a RUN executes in the builder's namespace on qits-net, where the edge
      # vhost the old flag reached ($QITS_MAVEN_CENTRAL_MIRROR_URL, 127.0.0.1:8080) does not resolve.
      # Empty deactivates the settings profile and the resolve goes to Central directly, as it always
      # did.
      #
      # `push=true` REPLACES `docker push`: the image goes from the builder straight to the registry,
      # under $QITS_BUILD_REGISTRY — the registry as the BUILDER resolves it. $QITS_REGISTRY stays
      # the host daemon's view and is not dialled anywhere in this step.
      repository="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/projects-daemon"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$repository:$version,push=true"

      # ---- the layered project-agent image ----------------------------------------------------
      #
      # ONE NAME PER BUILD STILL HOLDS. This is a second build with a single `--output`, not a second
      # name on the first: buildctl's push takes one name, and a second name would be a second
      # declaration. Two builds, two pushes, and each image is published before the next thing runs.
      #
      # THE DOCKERFILE LIVES BESIDE THE OTHER ONE, so the local context is the repo root and the
      # local dockerfile directory is `docker` again, with `filename=` naming the file — the whole of
      # what the retired `-f docker/Dockerfile.projects .` said.
      #
      # BOTH ARGS ARE PASSED QUALIFIED, AND QUALIFIED FOR THE BUILDER. docker/Dockerfile.projects
      # defaults them to bare names a developer's machine can resolve; nothing here has those, and a
      # build that fell back to them would either fail or — worse — succeed against something stale.
      # They are the references the BUILDER pulls `FROM`, so they carry $QITS_BUILD_REGISTRY and not
      # the host daemon's $QITS_REGISTRY. BASE carries `$base_version`, which is that file's own pin
      # read back above, so the qualification adds the registry and nothing else. DAEMON_IMAGE is the
      # reference just built and pushed, so the layer is this release's daemon and not a pull of some
      # other version — and it is passed WHOLE, which is why the Dockerfile is free to compose its
      # own default out of `${DAEMON_VERSION}` to stay invisible to the pin inventory.
      agent="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/project-agent:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt filename=Dockerfile.projects \
        --opt "build-arg:BASE=$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base:$base_version" \
        --opt "build-arg:DAEMON_IMAGE=$repository:$version" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$agent,push=true"

      # THERE IS NO `docker rmi` QUESTION LEFT for either image: neither ever enters a local image
      # store, so there is nothing to delete and nothing a delete could pull out from under a
      # concurrent build. The old note here recorded the 2026-08-11 release breaking on exactly that
      # race, and it was worse here than elsewhere because the daemon image is a build input to the
      # layered one; under `push=true` the layered build reads it back from the registry instead.

      # --- the SBOMs ------------------------------------------------------------------------------
      # TWO DECLARED ARTIFACTS, TWO DOCUMENTS. `artifacts:` above names two images and qits-ci
      # announces one `SoftwareRelease` per entry, so a version of either that a consumer can be
      # told about and cannot audit is exactly the gap this closes. Both go up AFTER both pushes and
      # BEFORE this step exits green: qits-ci announces only for a green run, so ordering is the
      # whole guarantee, and a failed PUT fails the release ON PURPOSE — the store being down is not
      # a reason to announce a version nobody can audit.
      #
      # The store is a sibling path of the npm registry inside the qits-artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries. NOT
      # from $QITS_REGISTRY, which is the host daemon's view of the registry and is dialled nowhere
      # in this step now: from in here it answers curl with an instant connection refusal, and the
      # edge in front of it 401s a sessionless write besides (measured twice on 2026.902.53027). Not
      # from $QITS_BUILD_REGISTRY either — that one is the BUILDER's view, and this curl is the
      # step's own. Each path names a DECLARED
      # artifact identity verbatim, because (packageType, packageName, version) is how the
      # SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"

      # THE DAEMON IMAGE'S DOCUMENT IS ITS MAVEN CLOSURE, and it comes out of the same Dockerfile
      # that built it: `target=sbom` reaches a `FROM scratch` stage holding the document the
      # builder's mvnw run already wrote, exported with `type=local` instead of pushed. Build-arg and
      # secrets are BYTE-IDENTICAL to the image build above, so every layer is a cache hit in the
      # same builder and this costs seconds rather than a second native compile.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/projects-daemon/-/$version"

      # THE AGENT IMAGE'S DOCUMENT IS ITS TWO HALVES, and there is nothing else it honestly could
      # be: docker/Dockerfile.projects compiles nothing and declares no manifest a scanner could
      # read — it copies one binary out of one published image onto another published image. What a
      # consumer of an agent container needs to know is exactly which two, at which versions, and
      # each of those has its own release and its own document to follow.
      #
      # BUILT FROM THE REFERENCES THIS STEP PASSED: both `FROM`s in docker/Dockerfile.projects are
      # `${BASE}` and `${DAEMON_IMAGE}`, so no line in that file is a resolvable reference and the
      # two --build-args above are the only place the real, registry-qualified coordinates exist.
      # `$base_version` did come out of that file's `ARG BASE` pin — but as the version alone, and
      # what the document records is the reference this build actually used.
      #
      # HAND-BUILT WITH printf, in three appends rather than one unreadable format string. Every
      # value goes through `%s`, so nothing in a reference can be read as a printf directive; both
      # $version and $base_version were refused above unless they are CalVer.
      base_repository="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base"
      agent_root="pkg:docker/qits/project-agent@$version"
      base_purl="pkg:docker/$base_repository@$base_version"
      daemon_purl="pkg:docker/$repository@$version"
      printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,' > sbom-project-agent.json
      printf '"metadata":{"component":{"type":"container","bom-ref":"%s",' \
        "$agent_root" >> sbom-project-agent.json
      printf '"name":"qits/project-agent","version":"%s","purl":"%s"}},' \
        "$version" "$agent_root" >> sbom-project-agent.json
      printf '"components":[' >> sbom-project-agent.json
      printf '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"},' \
        "$base_purl" "$base_repository" "$base_version" "$base_purl" >> sbom-project-agent.json
      printf '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"}],' \
        "$daemon_purl" "$repository" "$version" "$daemon_purl" >> sbom-project-agent.json
      printf '"dependencies":[{"ref":"%s","dependsOn":["%s","%s"]}]}\n' \
        "$agent_root" "$base_purl" "$daemon_purl" >> sbom-project-agent.json
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom-project-agent.json \
        "$sbom_base/docker/qits/project-agent/-/$version"
