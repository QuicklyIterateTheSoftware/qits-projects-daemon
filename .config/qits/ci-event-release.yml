# The release pipeline: this repository reacts to its OWN release TAG and pushes TWO images under the
# released VERSION — the daemon image, and the layered project-agent image built on top of it.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMPublishTag` says only "this repository now has this tag", and
# the git host says it the instant a push lands; nothing here pushes a tag. The event that could
# loop is `SoftwareRelease`, and this file neither listens for it nor emits it.
#
# THE VERSION TAG IS A NEW COORDINATE BESIDE THE SHA, NOT A REPLACEMENT FOR IT. ci-post-receive.yml
# keeps pushing `:$QITS_CI_SHA` on every green push; what this adds is a name a human and a
# downstream consumer can say out loud. The two coordinates have two owners — a build is named by
# its commit, a release by its version — and the step below says why that split is also the only
# shape that pushes reliably.
#
# THE LAYERED IMAGE IS THIS PIPELINE'S SECOND OUTPUT, AND IT EXISTS ONLY HERE. `qits/project-agent`
# is docker/Dockerfile.projects — the released workspace toolchain with this daemon copied in as its
# entrypoint — and it was a hand-built local tag (`qits/project-agent:native`) on one machine until
# this file built it. Both halves it layers were already published; the layering was not, so the
# image a refinement agent actually runs had no history and no coordinate anyone could name, and a
# host that lost its local image store lost the ability to start an agent at all.
#
# WHY IT IS NOT ALSO BUILT IN ci-post-receive.yml. The toolchain base is ~3.4 GB, so a sha-coordinate
# copy would pull and push that on every commit — and nothing consumes this image by sha. An agent
# is started from a version, so the version is the only coordinate worth the bytes. The daemon image
# stays in post-receive because it is small.
#
# THE BASE IS PINNED BY VERSION, NOT FOLLOWED BY A FLOATING TAG.
# `.config/qits/workspace-base.version` beside this file holds one line. images/qits-oci-workspace
# publishes only `:<version>` — no `:latest`, by its own ONE TAG PER PIPELINE rule — so there is no
# floating tag to follow even if we wanted one, and following one would make this image
# unreproducible: rebuilding a released version would silently pick up a different toolchain.
#
# ci-event-upstream-oci-workspace.yml IS WHAT MOVES THAT PIN, and ci-post-receive.yml's maintenance
# leg is what turns the moved pin into a release. The loop closes with nobody in it: the toolchain
# releases, the pin bumps onto `maintenance/qits-workspace-oci`, that push releases this repository,
# and this pipeline republishes `qits/project-agent` on the new base.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the
# `docker push`es below are this repository's own step — so it cannot see what landed. It announces
# one `SoftwareRelease` per entry on the strength of these lines once the whole pipeline is green.
# Keep them true.
#
# THE NAMES ARE UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the
# registry is `qits-platform-artifacts:8080` inside a step container and `localhost:8081` to qits-ci
# and qits-deployments — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/projects-daemon` and `qits/project-agent`, and the reader supplies its own host, exactly as
# the step below composes one from environment.
#
# THE DAEMON BUILD BELOW IS ci-post-receive.yml's, AND THE TWO MUST STAY MATCHED. That file explains
# why `docker: true` is what the Dockerfile's `localhost:8082` bases need, why no hand-rolled builder
# container is involved, and why there is no `--network` flag; this one carries the short form and
# points there rather than keeping a second copy of the reasoning to drift. The layered build has no
# counterpart there and never will — see above.
#
# THE TAG IS THE TRIGGER SO THAT A RESTORE NEEDS NOTHING ELSE. The tag is the durable release stamp
# — it outlives the event log, the run rows and every image store — so a bootstrap replay
# re-establishes this release by pushing the tag alone, and this pipeline rebuilds both images from
# it. A REAL release pushes the tag and has qits-workspaces publish `SCMRelease` beside it; that
# second event buys the ANNOUNCEMENT, not the images — qits-ci emits `SoftwareRelease` where a green
# run and an `SCMRelease` for the version meet. So a replay republishes silently and wakes no train
# (bootstrap-replay-plan.md in the wrapper).
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED. The bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
#
# THE COORDINATE PROBLEM THE OLD SELECTION HAD IS GONE WITH THE EVENT. `SCMRelease.repository`
# carries the repository's ROW ID, and this repository was registered by the projects self-seed
# reconcile, so its row id could be a UUID minted per platform instance — nothing a committed config
# can name. The selection matched nothing, silently, because CI logs matches and never non-matches;
# `repositoryName` was the answer. `SCMPublishTag` carries TWO identifiers rather than one, and only
# the second is addressable — the condition below says which and why.
event: SCMPublishTag
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match on repoId never fires. The tag event echoes the public name the push
  # was addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-projects-daemon }
artifacts:
  - { type: docker, name: qits/projects-daemon }
  - { type: docker, name: qits/project-agent }
steps:
    # ci-base: the docker CLI for the build, git for the tag checkout, jq for the event payload.
    # Nothing needs maven on THIS side of the socket — the reactor is built inside the image's own
    # builder stage.
    #
    # BOTH IMAGES ARE ONE STEP because the second consumes the first. A second step gets a fresh
    # container and an empty local image store, so it would have to pull the daemon image straight
    # back out of the registry it was just pushed to. Splitting buys nothing and costs a round trip.
    #
    # TWO HOURS, NOT ONE. The layered build pulls the ~3.4 GB toolchain base and pushes a layer on
    # top of it, on top of the daemon's native compile. images/qits-oci-workspace found an hour short
    # of headroom for the same bytes on a cold cache.
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push runs on a stale local image or fails, `docker rmi || true` answers 0,
      # and the run reports SUCCESS — and a green release run is what makes qits-ci announce the
      # artifact. -u makes an unset injected variable stop the step too.
      set -eu

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .tagName)
      # THE TAG NAME IS THE VERSION, and release versions are CalVer — digits and dots. Checked
      # before anything is built, because the version becomes a registry TAG: a malformed one would
      # publish the daemon under a coordinate nobody can guess, and a value carrying `:` or `/`
      # would land it under a different name entirely. It carries more weight than it did against
      # SCMRelease: no release flow vets this string now, since any tag pushed here arrives as one
      # of these events. qits-ci-daemon and qits-oci refuse the same way for the same reason.
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/projects-daemon:$version and qits/project-agent:$version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # is where the release commit is *now* — a later push moves that and the tag does not, so a
      # busy main cannot make this pipeline ship a different tree than the one that was released.
      # The clone is shallow and carries no tags, hence the explicit refspec; the URL rather than
      # `origin` because every address a step needs arrives as environment.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # THE TOOLCHAIN PIN, READ FROM THE RELEASED TREE. The checkout above already moved this tree to
      # `$version`, so the base version is the one that tree was released with — rebuilding a tag
      # rebuilds it on the same toolchain, which is the whole reason the pin is a committed file.
      # Reading it before the checkout would have taken main's.
      #
      # READ AND VALIDATED HERE, BEFORE ANY BUILD, though it is only used by the second one. A bad
      # pin caught after the daemon push would leave exactly the partial release this pipeline is
      # shaped to avoid: one of the two declared artifacts published, the other never built, and the
      # run red. Both inputs are checked while nothing has been pushed.
      base_version=$(cat .config/qits/workspace-base.version)
      # Validated exactly like $version, and for the same reason: it becomes part of an image
      # reference. A stray `:` or `/` would pull a different image entirely, and an empty file would
      # compose a reference with no tag — which docker reads as `:latest`, a tag
      # images/qits-oci-workspace never publishes.
      case "$base_version" in
        ''|*[!0-9.]*) echo "workspace-base.version is not a CalVer: $base_version" >&2; exit 1 ;;
      esac
      echo "layering onto qits/workspace-base:$base_version"

      # THE VERSION IS THE ONLY COORDINATE THIS STEP PUSHES, and the sha coordinate is not missing:
      # the release lands a commit on main, main's push runs ci-post-receive.yml, and that pushes
      # `:<sha>` for the very same tree. Publishing both from here as well was tried and is what the
      # first release of this file failed on — `docker build -t A -t B` reported naming both tags,
      # then `docker push B` answered "tag does not exist", because BuildKit's exporter does not
      # reliably leave every alias of a multi-tag build in the local image store. A second
      # `docker tag` would paper over it, but the honest reading is that the two coordinates have
      # two owners: post-receive names a build by its commit, and a release names it by its version.
      #
      # Each build is therefore one build and one push, which is also the shape that cannot leave a
      # partial release behind — the rule qits-oci's release pipeline states for its five images.
      #
      # THE TWO --secret FLAGS ARE THE FLEET'S SHAPE FOR A CREDENTIAL INSIDE A BUILD, and both builds
      # below carry them. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # Neither build here needs one: the daemon's Maven resolve is reactor-only over public
      # repositories, and Dockerfile.projects only copies. Inert on both counts — buildx ignores a
      # secret no RUN mounts, and a missing env source is NOT an error (measured on buildx v0.36.1,
      # the build runs green with the variable unset).
      repository="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/projects-daemon"
      docker build \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$repository:$version" -f docker/Dockerfile .

      docker push "$repository:$version"

      # ---- the layered project-agent image ----------------------------------------------------
      #
      # ONE TAG PER BUILD STILL HOLDS. This is a second build with a single `-t`, not a second `-t`
      # on the first: the rule the paragraph above states is about aliases of ONE build, which
      # BuildKit's exporter does not reliably leave in the local store. Two builds, two pushes, and
      # each image is pushed before the next thing runs.
      #
      # BOTH ARGS ARE PASSED QUALIFIED. docker/Dockerfile.projects defaults them to bare local
      # convenience tags (`qits/workspace-base:latest`) for a developer's machine; nothing here has
      # those, and a build that fell back to them would either fail or — worse — succeed against
      # something stale. DAEMON_IMAGE is the reference just built and pushed, so the layer is this
      # release's daemon and not a pull of some other version.
      agent="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/project-agent:$version"
      docker build -t "$agent" -f docker/Dockerfile.projects \
        --build-arg "BASE=$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base:$base_version" \
        --build-arg "DAEMON_IMAGE=$repository:$version" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET .
      docker push "$agent"

      # NO `docker rmi` for either image: on a CI host it frees nothing — the layers stay in the
      # builder's cache either way — while under the containerd image store it drops the last
      # reference to content a concurrent build of this same Dockerfile may still be resolving,
      # which is the race that broke the release of 2026-08-11. It is worse here than elsewhere:
      # the daemon image is a build input to the layered one above, so a delete can pull content
      # out from under a run that is still reading it.

      # --- the SBOMs ------------------------------------------------------------------------------
      # TWO DECLARED ARTIFACTS, TWO DOCUMENTS. `artifacts:` above names two images and qits-ci
      # announces one `SoftwareRelease` per entry, so a version of either that a consumer can be
      # told about and cannot audit is exactly the gap this closes. Both go up AFTER both pushes and
      # BEFORE this step exits green: qits-ci announces only for a green run, so ordering is the
      # whole guarantee, and a failed PUT fails the release ON PURPOSE — the store being down is not
      # a reason to announce a version nobody can audit.
      #
      # The store is a sibling path of the npm registry inside the qits-artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries. NOT
      # from $QITS_REGISTRY, which is the host-published name the docker daemon pushes through: from
      # in here it answers curl with an instant connection refusal, and the edge in front of it 401s
      # a sessionless write besides (measured twice on 2026.902.53027). Each path names a DECLARED
      # artifact identity verbatim, because (packageType, packageName, version) is how the
      # SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"

      # THE DAEMON IMAGE'S DOCUMENT IS ITS MAVEN CLOSURE, and it comes out of the same Dockerfile
      # that built it: `--target sbom` reaches a `FROM scratch` stage holding the document the
      # builder's mvnw run already wrote. Secrets are BYTE-IDENTICAL to the image build above and
      # there is still no `--network` flag, so every layer is a cache hit and this costs seconds
      # rather than a second native compile.
      docker build --target sbom --output type=local,dest=.sbom \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -f docker/Dockerfile .
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/projects-daemon/-/$version"

      # THE AGENT IMAGE'S DOCUMENT IS ITS TWO HALVES, and there is nothing else it honestly could
      # be: docker/Dockerfile.projects compiles nothing and declares no manifest a scanner could
      # read — it copies one binary out of one published image onto another published image. What a
      # consumer of an agent container needs to know is exactly which two, at which versions, and
      # each of those has its own release and its own document to follow.
      #
      # BUILT FROM THE REFERENCES THIS STEP PASSED, not scraped out of the Dockerfile: both `FROM`s
      # there are `${BASE}` and `${DAEMON_IMAGE}`, so the file itself names nothing resolvable and
      # the two --build-args above are the only place the real coordinates exist. Reading them back
      # from the variables is also what keeps the document honest if a default ever drifts.
      #
      # HAND-BUILT WITH printf, in three appends rather than one unreadable format string. Every
      # value goes through `%s`, so nothing in a reference can be read as a printf directive; both
      # $version and $base_version were refused above unless they are CalVer.
      base_repository="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base"
      agent_root="pkg:docker/qits/project-agent@$version"
      base_purl="pkg:docker/$base_repository@$base_version"
      daemon_purl="pkg:docker/$repository@$version"
      printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,' > sbom-project-agent.json
      printf '"metadata":{"component":{"type":"container","bom-ref":"%s",' \
        "$agent_root" >> sbom-project-agent.json
      printf '"name":"qits/project-agent","version":"%s","purl":"%s"}},' \
        "$version" "$agent_root" >> sbom-project-agent.json
      printf '"components":[' >> sbom-project-agent.json
      printf '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"},' \
        "$base_purl" "$base_repository" "$base_version" "$base_purl" >> sbom-project-agent.json
      printf '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"}],' \
        "$daemon_purl" "$repository" "$version" "$daemon_purl" >> sbom-project-agent.json
      printf '"dependencies":[{"ref":"%s","dependsOn":["%s","%s"]}]}\n' \
        "$agent_root" "$base_purl" "$daemon_purl" >> sbom-project-agent.json
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom-project-agent.json \
        "$sbom_base/docker/qits/project-agent/-/$version"
