# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, INCLUDING THE ONE THAT PUSHES AN IMAGE. It stays in the gating half on
# purpose: whatever a run publishes is published before anything later can fail. The coordinate it
# pushes is the MERGED SHA, which no `ReleaseRequestChanged` is ever derived from, so this pipeline
# cannot re-trigger itself; and a redelivered event re-pushes identical content under the same tag,
# which is why nothing here treats an existing tag as an error. The verdict returns on the ordinary
# `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what qits-projects'
# `BuildStatusListener` matches on together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# Two steps, and their order is the point:
#
#   1. `./mvnw verify` — this repo's first rule (docker/Dockerfile states it): a clone of this repo
#      alone builds and tests green, with no monorepo, no docker and no prior install anywhere. It
#      runs FIRST because it is the cheap gate. A broken test must not cost a GraalVM native build.
#   2. the shipping form — the container image, whose builder stage is the native compile.
#
# THIS REPO NEEDS NO HAND-ROLLED BUILDER CONTAINER. docker/Dockerfile already native-compiles the
# binary in a Mandrel builder stage, so a plain `docker build` is the whole native build.
# qits-ci-daemon starts a builder container by hand and copies the binary out because it ships a
# bare binary and no image at all; that shape does not belong here.
#
# WHY THE IMAGE STEP DECLARES `docker: true`: it hands the step the HOST daemon's socket, which is
# the side the Dockerfile is written for. Its `FROM localhost:8082/…` lines are
# qits-platform-mirror's pull-through mirrors of quay.io and registry.access.redhat.com — an address
# the host daemon resolves and nothing inside this step's container can. The native build's memory
# is the host daemon's for the same reason.
#
# No `--network` flag: nothing in this build dials the platform. The reactor declares no
# `<repositories>`, so the builder stage resolves from Maven Central, and the base images are the
# host daemon's to pull.
#
# THE NAME SEGMENT IS `projects-daemon`, NOT THIS REPOSITORY'S NAME. `qits/projects-daemon` is what
# the Dockerfile and ci-event-release.yml's declaration already say. The rule that the segment must
# equal the repository id is qits-deployments' — it derives what to run from the repository and the
# sha of a green build — and it does not reach here: a daemon has no container of its own to deploy,
# so this repo carries no deployments.yml and nothing derives a ref from its name.
#
# THE BUILD BELOW IS ci-event-release.yml's, AND THE TWO MUST STAY MATCHED. Both pipelines publish
# the same image content under different coordinates — the sha here, the released version there —
# so a fix to one build belongs in the other.
#
# THIS FILE DOES NOT BUILD `qits/project-agent`. The layered agent image is a ~3.4 GB pull and push,
# and nothing starts an agent from a sha — so paying that on every fold would buy a coordinate no
# consumer can use. ci-event-release.yml builds it, once, per version.
#
# THE BUMP TRAIN REACHES THIS FILE THROUGH A RELEASE REQUEST NOW, NOT THROUGH A PUSH.
# ci-event-upstream-oci-workspace.yml still follows a toolchain release by rewriting
# `.config/qits/workspace-base.version` and pushing `maintenance/qits-workspace-oci`. That push no
# longer builds anything on its own — there is no push pipeline left to catch it — so the branch is
# a SOURCE, and it is built here when qits-maintenance folds it into a release request. The release
# that used to follow the build was a third step here asking the qits-workspaces door;
# qits-maintenance makes that ask itself, with its own credential. This pipeline builds; it no
# longer releases.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-projects-daemon }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS.
      set -eu
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify

  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # Same reason as above, and one more: without -e a failed `docker build` lets the push run on
      # a stale local image, `docker rmi || true` answers 0, and the run reports SUCCESS for an
      # image that was never built. -u stops the step on an unset registry variable rather than
      # composing a ref out of empty strings.
      set -eu
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and the Dockerfile's mvnw
      # RUN mounts them for `.qits-maven-settings.xml`'s `qits-central-proxy` server — never a
      # --build-arg, which is recorded in a pullable image's history.
      #
      # --network host and the QITS_MAVEN_CENTRAL_URL build-arg route the RUN's Maven Central
      # resolve through the mirror: the injected URL is an edge vhost on 127.0.0.1:8080, which only
      # the host namespace reaches. Empty — an older qits-ci, or the mirror plane turned off —
      # deactivates the settings profile and the resolve goes to Central directly, as it always did.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/projects-daemon:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
