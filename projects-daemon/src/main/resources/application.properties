# projects-daemon — the per-project agent container's process.
# A command-mode app with NO web stack and NO datasource: it dials home over a WebSocket, self-clones
# the project's wrapper repository, and runs the coding-agent sessions a user drives from a web
# terminal. All identity and reachability is injected as container env by qits-projects
# (QITS_PROJECTS_DAEMON_* -> qits.projects-daemon.*), so this file carries only defaults and logging.

# The dial-home URL (ws://<host>:<port>/projects/daemon/<projectId>) and identity are supplied as env
# at container creation. Left unset here on purpose: a daemon that boots without them logs and stays
# idle — the container must not die for want of a socket. The daemon dials the url verbatim and
# parses no path out of it; the shape above is qits-projects' control socket, recorded so this file
# reads against the same convention as everything else.
# qits.projects-daemon.url=
# qits.projects-daemon.project-id=
# The wrapper repository the container self-clones: <gitBase>/<projectId>/<repoName>. Both halves are
# required — the clone is always name-addressed, because the wrapper's relative submodule urls
# resolve against it.
# qits.projects-daemon.repo-name=

# The git host the boot self-clone reads from: qits-artifacts, which serves /artifacts/git/... under
# that prefix through the gateway AND when dialled directly, so the prefix is not something an
# in-network client may drop. Unset ⇒ Provisioner derives <dial-home authority>/artifacts/git and
# emits a WARN saying so, because the control socket is a DIFFERENT service (qits-projects) and the
# derivation only holds where one authority routes every segment. See Provisioner's javadoc.
# qits.projects-daemon.git-base=

# The ONE MCP server an agent launch is wired with — `repository`, served by qits-projects at
# /projects/mcp, carrying both the repository tools and the epic tools a refinement session drafts
# through. qits-projects INJECTS this as QITS_REPOSITORY_MCP_URL on every container it creates, so a
# deployed daemon is told the address rather than deriving one.
#
# Unset, it is derived from the control socket's authority, and unlike the git host above that
# derivation emits no warning: qits-projects is the very service the control socket points at. The
# derivation stays as the fallback for a container created before the env existed and for a daemon
# run by hand; the key also points an agent at a different qits instance, or at a separately deployed
# MCP server if that ever splits out.
#
# The workspace daemon's `actions` and `observability` servers have no key here and no address: a
# refinement agent's job is the project's plan, not workspace actions or another service's
# telemetry. See AgentLaunchService.serversFor.
# qits.repository-mcp.url=

# Build identity, filtered in at build time (@-delimited, see pom.xml) and announced in the Hello.
# `version` is the Maven project.version (distinguishes numbered releases); `build.time` is the build
# timestamp (distinguishes floating -SNAPSHOT builds). Baked into the native image as config, so the
# daemon reports them with no runtime file read.
qits.projects-daemon.build.version=@project.version@
qits.projects-daemon.build.time=@timestamp@

# Liveness ping cadence and the reconnect backoff ceiling.
qits.projects-daemon.heartbeat-interval-ms=20000
qits.projects-daemon.reconnect-max-backoff-ms=30000

# Grace a terminate gives a command's process group between SIGTERM and SIGKILL.
qits.projects-daemon.term-grace-ms=5000

# Loopback port the in-container coding-agent lifecycle hooks POST to (HookWebhook). Must match the
# port AgentLaunchService renders into the hook curl — ControlSocket passes one field to both, which
# is what makes a mismatch impossible. Bound to 127.0.0.1 only, so it is reachable from the agent
# process in the same container and from nowhere else.
qits.projects-daemon.hooks-port=13337

# The daemon's API over its checkout (ProjectsApi): commands, coding agents, and the two interactive
# websockets.
#
# LOOPBACK, like the hook webhook, and for the same reason: the only client that reaches it shares
# the container's network namespace. That client is DaemonStreamTunnel, which dials OUT to qits when
# asked over the control socket and pipes the connection here. A peer agent container's connection is
# refused by the network stack rather than by a token check. Own port so the hook sink stays a
# separate surface.
qits.projects-daemon.api-port=13338
qits.projects-daemon.api-bind-address=127.0.0.1

# Where this API is mounted, as its caller addresses it — injected per container as
# QITS_PROJECTS_DAEMON_API_BASE_PATH=/projects/container/<projectId>/.
#
# It exists because NO HOP IN THE CHAIN REWRITES A PATH. The proxy forwards what the caller asked
# for, byte for byte, and the tunnel under it carries the request line verbatim — so the daemon is
# TOLD which leading part of that path is its own address rather than deriving one by stripping a
# segment or matching a shape. That is the same property the control-socket url has: handed over
# whole, dialled verbatim, never parsed. A hop that rewrote the path would leave the caller and the
# daemon disagreeing about this daemon's address, and that kind of disagreement surfaces a long way
# from the rewrite that caused it.
#
# Unset here on purpose: blank means "nothing fronts me", the routes are served exactly as ProjectsApi
# spells them, and every direct caller — a test, a loopback probe — keeps working.
# qits.projects-daemon.api-base-path=

# The bearer every API request must present, injected per container as
# QITS_PROJECTS_DAEMON_API_TOKEN like the rest of the daemon's identity. Left unset here on purpose,
# and unset means the API DOES NOT BIND (with a warning): an omitted env is indistinguishable from a
# misconfiguration, and this server runs processes over an untrusted checkout, so it must degrade to
# "unavailable" and never to "anonymous". Defence in depth behind the loopback bind, not the
# boundary — see ProjectsApi's javadoc for why that distinction is worth keeping straight.
# qits.projects-daemon.api-token=

# Where the shared agent-credential volume mounts. Agent launches point HOME here so the in-container
# `claude` reads the operator's one-time OAuth login off the volume instead of a per-session secret.
qits.projects-daemon.claude-mount=/claude-home

# Agent launch defaults. The harness when the request names none (CLAUDE when unset), whether the
# turn-boundary activity hooks are wired (the lineage hook is unconditional), and the transcript
# tail's poll interval.
# qits.agent.default-type=
qits.agent.activity-tracking-enabled=true
qits.agent.transcript-tail-poll-ms=500

# Name the compiled artifact `qits-projects-daemon` (not projects-daemon-<version>-runner): drop the
# -runner suffix and set the base name, so `-Dnative` produces target/qits-projects-daemon directly —
# a qits-namespaced process name identifiable in `ps`/`docker top` as PID 1's child.
quarkus.package.output-name=qits-projects-daemon
quarkus.package.jar.add-runner-suffix=false

# Keep the native image lean and quiet. Only the hand-written DaemonLog frames stream home once
# connected — the ordinary Logger calls here go to container stdout and nowhere else.
quarkus.log.level=INFO
quarkus.banner.enabled=false

# --enable-native-access is NOT settable here, and that is the point of this note.
#
# ForeignPty calls libc through java.lang.foreign, a restricted method. The native image resolves
# native access at build time and needs nothing, and that is what ships (docker/Dockerfile.projects
# ENTRYPOINTs the native binary). But the daemon run as a JVM app warns on every PTY launch and, per
# the warning's own text, will be refused outright in a future release — and a runner jar cannot add
# its own JVM flags, so no property fixes it. Pass it on the command line:
#
#     java --enable-native-access=ALL-UNNAMED -jar target/quarkus-app/quarkus-run.jar
#
# The surefire blocks in qits-commands, qits-coding-agents and projects-daemon set it for tests,
# which is the other place a JVM opens a PTY.
