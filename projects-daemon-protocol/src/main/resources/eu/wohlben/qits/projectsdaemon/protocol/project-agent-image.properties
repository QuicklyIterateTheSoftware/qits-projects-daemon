# Filtered at build time — see projects-daemon-protocol/pom.xml's <resources> block and
# ProjectAgentImage's javadoc. The value is this reactor's ${project.version}, which the release
# flow stamps with the version it is about to tag and push both images under, so the jar's version,
# the `qits/project-agent` tag, the `qits/projects-daemon` tag and the daemon binary's version are
# one string by construction.
#
# Do NOT write a literal here. ProjectAgentImage refuses a value that still starts with `$`, which
# is what an unfiltered copy of this file looks like.
version=${project.version}
